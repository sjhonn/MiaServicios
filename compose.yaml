# Ejecuta MiaServicios de forma aislada para producción local.
name: miaservicios

x-service-defaults: &service-defaults
  init: true
  restart: unless-stopped
  stop_grace_period: 15s
  networks:
    - internal
  logging:
    driver: local
    options:
      max-size: "10m"
      max-file: "3"

services:
  auth-service:
    <<: *service-defaults
    build: ./backend/auth-service
    environment:
      NODE_ENV: production
      PORT: 4001
      HOST: 0.0.0.0
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET en el archivo .env}
      DATABASE_FILE: /app/data/auth.db
      ACCESS_TOKEN_TTL_SECONDS: ${ACCESS_TOKEN_TTL_SECONDS:-900}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-7}
    volumes:
      - auth-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4001/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s
    mem_limit: 256m
    cpus: 0.50

  ai-service:
    <<: *service-defaults
    build: ./backend/ai-service
    environment:
      NODE_ENV: production
      PORT: 4002
      HOST: 0.0.0.0
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4002/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 15s
    mem_limit: 256m
    cpus: 0.50

  history-service:
    <<: *service-defaults
    build: ./backend/history-service
    environment:
      NODE_ENV: production
      PORT: 4003
      HOST: 0.0.0.0
      SERVICE_KEY: ${SERVICE_KEY:?Defina SERVICE_KEY en el archivo .env}
      DATABASE_FILE: /app/data/history.db
    volumes:
      - history-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4003/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s
    mem_limit: 256m
    cpus: 0.50

  api-gateway:
    <<: *service-defaults
    build: ./backend/api-gateway
    environment:
      NODE_ENV: production
      PORT: 4000
      HOST: 0.0.0.0
      TRUST_PROXY: "true"
      AUTH_SERVICE_URL: http://auth-service:4001
      AI_SERVICE_URL: http://ai-service:4002
      HISTORY_SERVICE_URL: http://history-service:4003
      SERVICE_KEY: ${SERVICE_KEY:?Defina SERVICE_KEY en el archivo .env}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
    depends_on:
      auth-service:
        condition: service_healthy
      ai-service:
        condition: service_healthy
      history-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    mem_limit: 256m
    cpus: 0.50

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - internal
      - public
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    mem_limit: 128m
    cpus: 0.25

networks:
  internal:
    internal: true
  public:

volumes:
  auth-data:
  history-data:
